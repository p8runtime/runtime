[package]
name = "php-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The php command-line host for p8"

[[bin]]
name = "php2"
path = "src/main.rs"

[dependencies]
p8 = { path = "../p8" }
# Allocator experiment (draft): each feature makes one pure-Rust crate php2's
# #[global_allocator]; no feature = the system allocator (glibc / libmalloc).
dlmalloc = { version = "=0.2.14", features = ["global"], optional = true }
rlsf = { version = "=0.2.3", optional = true }
talc = { version = "=5.1.1", optional = true }
spinning_top = { version = "0.3", optional = true }
rusty_alloc-api = { version = "=2.4.0", optional = true }

[features]
alloc-dlmalloc = ["dep:dlmalloc"]
alloc-rlsf = ["dep:rlsf"]
alloc-talc = ["dep:talc", "dep:spinning_top"]
alloc-rusty = ["dep:rusty_alloc-api"]
