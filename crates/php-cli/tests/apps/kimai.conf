# Kimai's unit tests, as its CI runs them (composer tests-unit: everything
# but the integration group, which needs MySQL).
NAME=Kimai KIND=application VERSION=2.71.0
ABOUT="Time tracking for teams and freelancers (a Symfony app)."
SOURCE=https://www.kimai.org
REPO=https://github.com/kimai/kimai COMMIT=b484ad4ebdcccc4412fb6d2344e3f3a973fcd378
SUITE_NAME="Kimai's PHPUnit unit tests" SUITE_SOURCE=https://github.com/kimai/kimai/tree/2.71.0/tests
TEST_CMD="vendor/bin/phpunit --exclude-group integration tests/"
TESTS_ROOT=tests/
# Its test bootstrap creates the test database (MySQL) first, unit tests too.
DB=kimai
PHP_ENV='DATABASE_URL=mysql://root:p8root@@HOST@:@PORT@/@DB@?charset=utf8mb4&serverVersion=11.4.0-MariaDB'
P8_ENV="$PHP_ENV"
