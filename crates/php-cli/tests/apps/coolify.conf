# Coolify's Pest unit tests (its feature tests need PostgreSQL and Redis).
# The app needs its .env and Laravel's package discovery, made under PHP.
NAME=Coolify KIND=application VERSION=v4.5.3
ABOUT="Self-hosted platform for deploying apps, databases and services (a Laravel app)."
SOURCE=https://coolify.io
REPO=https://github.com/coollabsio/coolify COMMIT=70c1bcb1381de7d42fd290e6cd50bf9a5bcf714d
SUITE_NAME="Coolify's Pest unit tests" SUITE_SOURCE=https://github.com/coollabsio/coolify/tree/v4.5.3/tests/Unit
SETUP="cp .env.development.example .env && php artisan key:generate --force && php artisan package:discover" SETUP_FILES=".env bootstrap/cache"
TEST_CMD="vendor/bin/pest --testsuite Unit"
TESTS_ROOT=tests/Unit/,tests/
