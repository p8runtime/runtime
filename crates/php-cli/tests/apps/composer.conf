# Composer's own PHPUnit tests, as its CI runs them (simple-phpunit installs
# the PHPUnit version Composer pins, once, under PHP).
NAME=Composer KIND=application VERSION=2.11.0
ABOUT="PHP's dependency manager."
SOURCE=https://getcomposer.org
REPO=https://github.com/composer/composer COMMIT=e52c65bed1de6aa272cdde4b7725ca6653d7b06a
SUITE_NAME="Composer's PHPUnit tests" SUITE_SOURCE=https://github.com/composer/composer/tree/2.11.0/tests
# (simple-phpunit installs with the composer command)
SETUP='curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/tmp --filename=composer && PATH=/tmp:$PATH vendor/bin/simple-phpunit install'
SETUP_FILES="vendor/bin/.phpunit"
TEST_CMD="vendor/bin/simple-phpunit"
TESTS_ROOT=tests/Composer/Test/
