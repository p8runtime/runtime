[package]
name = "p8-ext-mbstring"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "p8's mbstring extension: multibyte strings over UTF-8, the Unicode and single-byte encodings, with php-src's own case and width tables"

[dependencies]
encoding_rs = "0.8"
# Substring search (SIMD, safe API; the version p8-syntax uses)
memchr = "2.7"
p8-pcre = { path = "../p8-pcre" }
p8-runtime = { path = "../p8-runtime" }
p8-stubs = { path = "../p8-stubs" }
