[package]
name = "p8-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "p8's values: scalars, strings, arrays, references, and PHP 8.4's operators on them"

[dependencies]
p8-stubs = { path = "../p8-stubs" }
hashbrown = { version = "0.16", default-features = false }
indexmap = "2.0"
# The name tables' hasher (see fast.rs); already hashbrown's default.
foldhash = "0.1"

[features]
# Per-thread counts of hash-table work (counts.rs), for tests; off in
# every ordinary build.
counts = []
