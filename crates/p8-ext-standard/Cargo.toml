[package]
name = "p8-ext-standard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "p8's standard extension: PHP 8.4's constants and core builtin functions"

[dependencies]
p8-runtime = { path = "../p8-runtime" }
# Hashes (RustCrypto, pure Rust; the versions the workspace already uses)
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.5"
# zlib: compression in pure Rust (miniz_oxide; zlib-rs would export C-ABI symbols from p8)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha3 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
md2 = "0.10"
md4 = "0.10"
gost94 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
# random_bytes, random_int: the OS's randomness
getrandom = "0.2"
# password_hash: bcrypt on RustCrypto's Blowfish (its eksblowfish steps), argon2i/argon2id
blowfish = { version = "0.9", features = ["bcrypt"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Dates: time zones (the IANA database, built in)
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
