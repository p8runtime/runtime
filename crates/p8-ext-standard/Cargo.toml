[package]
name = "p8-ext-standard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "p8's standard extension: PHP 8.4's constants and core builtin functions"

[dependencies]
p8-runtime = { path = "../p8-runtime" }
# Hashes (RustCrypto, pure Rust; the versions the workspace already uses)
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.5"
# random_bytes, random_int: the OS's randomness
getrandom = "0.2"
# Dates: time zones (the IANA database, built in)
chrono = "0.4"
chrono-tz = "0.10"
