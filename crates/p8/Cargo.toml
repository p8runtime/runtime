[package]
name = "p8"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "p8: an embeddable PHP 8.4 engine"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bumpalo = { version = "3.12", features = ["collections"] }
p8-bytecode = { path = "../p8-bytecode" }
p8-compiler = { path = "../p8-compiler" }
p8-ext-standard = { path = "../p8-ext-standard" }
p8-ext-xml = { path = "../p8-ext-xml" }
p8-interp = { path = "../p8-interp" }
p8-runtime = { path = "../p8-runtime" }
p8-syntax = { path = "../p8-syntax" }
p8-ext-tokenizer = { path = "../p8-ext-tokenizer" }
p8-ext-mbstring = { path = "../p8-ext-mbstring" }
p8-ext-pcre = { path = "../p8-ext-pcre" }
p8-ext-gd = { path = "../p8-ext-gd" }
p8-ext-zip = { path = "../p8-ext-zip" }
p8-ext-fileinfo = { path = "../p8-ext-fileinfo" }
p8-ext-session = { path = "../p8-ext-session" }
p8-ext-pdo = { path = "../p8-ext-pdo" }
p8-ext-pdo-sqlite = { path = "../p8-ext-pdo-sqlite" }
p8-ext-openssl = { path = "../p8-ext-openssl" }
p8-ext-intl = { path = "../p8-ext-intl" }

# build.rs hashes the engine's source: a package is used only by the same engine.
[build-dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The tests count hash-table work (p8_runtime::counts).
[dev-dependencies]
p8-runtime = { path = "../p8-runtime", features = ["counts"] }

# The extensions that exist to talk over the network (to a server, a
# database or a socket): not in a WASI build, where wasm32-wasip1 has no
# sockets; that p8 is a PHP built without them.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
p8-ext-mysqli = { path = "../p8-ext-mysqli" }
p8-ext-curl = { path = "../p8-ext-curl" }
p8-ext-sockets = { path = "../p8-ext-sockets" }
p8-ext-pdo-pgsql = { path = "../p8-ext-pdo-pgsql" }
p8-ext-pdo-mysql = { path = "../p8-ext-pdo-mysql" }
