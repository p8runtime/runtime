[package]
name = "php-test"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runs php-src's .phpt tests against p8"

# php-src's test runner (php-src/README.md); not a user command (that is p8).
[[bin]]
name = "php-test"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
regex = "1.12.2"
serde_json = "1.0"
walkdir = "2.4"
