[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
# The interpreter's dispatch loop and value operations live in different
# modules: whole-program optimization lets them inline into one another.
lto = "fat"
codegen-units = 1

# Release with full debug info, for profilers (perf, callgrind, pprof): the
# same optimized, fat-LTO code, with DWARF line and inline tables so code
# inlined into the dispatch loop keeps its own function, file and line.
# `cargo build --profile profiling -p php-cli` -> target/profiling/p8.
[profile.profiling]
inherits = "release"
debug = true

# p8 for wasm32-wasip1 (packages/vite-plugin-p8): release, optimized for
# size and without its symbol names, so the module a host downloads and
# compiles is smaller; the native release profile is left as it is.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
